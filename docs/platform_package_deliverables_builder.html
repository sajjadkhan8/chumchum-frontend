
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1.5rem 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.tab-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 999px;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-secondary);
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: all 0.15s;
}
.tab-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.tab-btn.active { background: var(--active-color); color: #fff; border-color: transparent; }
.tab-btn i { font-size: 15px; }

.platform-section { display: none; }
.platform-section.active { display: block; }

.section-label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--color-text-tertiary);
  margin: 1.5rem 0 0.75rem;
}
.section-label:first-child { margin-top: 0; }

.deliverables-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}

.item {
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 12px 14px;
  background: var(--color-background-primary);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.item:hover { border-color: var(--color-border-secondary); background: var(--color-background-secondary); }
.item.selected { border-color: var(--active-color); background: var(--active-bg); }

.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.item-icon { font-size: 18px; color: var(--color-text-secondary); }
.item.selected .item-icon { color: var(--active-color); }
.item-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.item-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
.check { margin-left: auto; width: 18px; height: 18px; border-radius: 50%;
  border: 0.5px solid var(--color-border-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: transparent; flex-shrink: 0; }
.item.selected .check { background: var(--active-color); border-color: var(--active-color); color: #fff; }

.footer {
  margin-top: 1.5rem; padding-top: 1.25rem;
  border-top: 0.5px solid var(--color-border-tertiary);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.selected-summary { font-size: 13px; color: var(--color-text-secondary); }
.selected-summary strong { color: var(--color-text-primary); font-weight: 500; }
.add-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 20px; border-radius: 999px;
  background: var(--active-color); color: #fff;
  border: none; cursor: pointer; font-size: 13px; font-weight: 500;
}
.add-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.add-btn i { font-size: 14px; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
  background: var(--active-bg); color: var(--active-color);
  margin-left: 6px;
}
</style>

const selected = {};
let activePlatform = 'instagram';

function getColor(p) { return p.color; }
function getBg(p) { return p.bg; }

function setActive(id) {
  activePlatform = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.platform-section').forEach(s => s.classList.toggle('active', s.dataset.id === id));
  const p = platforms.find(x => x.id === id);
  document.documentElement.style.setProperty('--active-color', p.color);
  document.documentElement.style.setProperty('--active-bg', p.bg);
  updateSummary();
}

function toggleItem(pid, itemName) {
  if (!selected[pid]) selected[pid] = new Set();
  if (selected[pid].has(itemName)) selected[pid].delete(itemName);
  else selected[pid].add(itemName);
  document.querySelectorAll(`[data-pid="${pid}"][data-item="${CSS.escape(itemName)}"]`)
    .forEach(el => el.classList.toggle('selected', selected[pid].has(itemName)));
  updateSummary();
}

function updateSummary() {
  const total = Object.values(selected).reduce((a, s) => a + s.size, 0);
  const p = platforms.find(x => x.id === activePlatform);
  const pCount = (selected[activePlatform] || new Set()).size;
  const sumEl = document.getElementById('summary');
  const btn = document.getElementById('add-btn');
  if (total === 0) {
    sumEl.innerHTML = 'Select deliverables to add to your package';
    btn.disabled = true;
  } else {
    const parts = platforms.filter(p => selected[p.id]?.size > 0)
      .map(p => `<strong>${selected[p.id].size} ${p.name}</strong>`).join(', ');
    sumEl.innerHTML = `${parts} selected`;
    btn.disabled = false;
  }
}

function addToPackage() {
  const lines = [];
  platforms.forEach(p => {
    if (selected[p.id]?.size) {
      lines.push(`${p.name}: ${[...selected[p.id]].join(', ')}`);
    }
  });
  sendPrompt(`Add these deliverables to my ZingZing package:\n${lines.join('\n')}`);
}

function build() {
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('platform-panels');

  platforms.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (p.id === activePlatform ? ' active' : '');
    btn.dataset.id = p.id;
    btn.innerHTML = `<i class="ti ${p.icon}" aria-hidden="true"></i>${p.name}`;
    btn.onclick = () => setActive(p.id);
    tabsEl.appendChild(btn);

    const sec = document.createElement('div');
    sec.className = 'platform-section' + (p.id === activePlatform ? ' active' : '');
    sec.dataset.id = p.id;

    p.sections.forEach(s => {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = s.label;
      sec.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'deliverables-grid';

      s.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item';
        card.dataset.pid = p.id;
        card.dataset.item = item.name;
        card.innerHTML = `
          <div class="item-head">
            <i class="ti ${item.icon} item-icon" aria-hidden="true"></i>
            <span class="item-name">${item.name}</span>
            <span class="check"><i class="ti ti-check" aria-hidden="true"></i></span>
          </div>
          <div class="item-desc">${item.desc}</div>`;
        card.onclick = () => toggleItem(p.id, item.name);
        grid.appendChild(card);
      });
      sec.appendChild(grid);
    });
    panelsEl.appendChild(sec);
  });

  const p = platforms.find(x => x.id === activePlatform);
  document.documentElement.style.setProperty('--active-color', p.color);
  document.documentElement.style.setProperty('--active-bg', p.bg);
}

build();
</script>
